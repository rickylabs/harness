# The one pipeline in this repository that publishes anything.
#
# It exists because `@rickylabs/harness-contracts` is the only package meant to leave here: both
# cockpits live in netscript and this is what they share. Everything else is private and never
# leaves.
#
# Three properties are worth stating, because each one is a decision rather than a default:
#
# **It is inert until someone deliberately cuts a release.** It has no `push: branches` trigger. A
# tag matching `harness-contracts-v*`, or a manual dispatch, is the only way it runs — and the
# manual path defaults to a dry run. Until the repository has an `NPM_TOKEN`, the publish step
# cannot succeed even if it is reached, which is the correct order: the pipeline is reviewable
# before the credential exists.
#
# **It trusts the tag with nothing.** A tag can be pushed to any commit, so before anything is
# uploaded this workflow checks two things the tag cannot vouch for on its own: that the commit is an
# ancestor of `main`, which is where review and the `ci` workflow happen, and that the version in the
# tag is the version in the manifest. `harness-contracts-v0.2.0` publishing `0.1.0` burns a version
# number permanently — the real 0.2.0 could then never be published.
#
# **It re-runs the whole workspace, not just the package.** A green CI run on the merge commit does
# not license a publish from a tag, because the tag may not be that commit. So typecheck, build and
# test run again here against exactly the tree being shipped. An npm version is immutable; there is
# no revert, only a new version and a deprecation notice on the old one.
name: release-contracts

on:
  push:
    tags: ["harness-contracts-v*"]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build, test and pack without publishing"
        type: boolean
        default: true

concurrency:
  group: release-contracts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # npm provenance is signed with a short-lived OIDC token minted per run, so the attestation says
  # which workflow, at which commit, produced the tarball. This is what makes the published package
  # traceable back to this file rather than to whoever happened to hold a token.
  id-token: write

jobs:
  release:
    name: publish @rickylabs/harness-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A tag push publishes. A manual dispatch publishes only if someone explicitly turned the dry
    # run off, and even then the version check below still demands that it be running on a tag.
    env:
      PUBLISHING: ${{ github.event_name == 'push' || inputs.dryRun == false }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the ancestry check below needs it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          # Writes the .npmrc that makes NODE_AUTH_TOKEN mean something to `npm publish`.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The same three commands CI runs, against the tagged tree rather than the merge commit.
      # `build` ends in `check:publish`, which is where the manifest, the compiled PACKAGE_NAME,
      # the protocol version and the tarball contents are checked against each other.
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test

      # A tag can be pushed to any commit, including one that never opened a pull request. Publishing
      # is the one action here with no undo, so it is restricted to code that reached the default
      # branch — which is where review and the `ci` workflow actually happen.
      - name: the tag must be on main
        if: env.PUBLISHING == 'true'
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "refusing to publish from $GITHUB_REF_TYPE $GITHUB_REF_NAME; a release is cut from a tag"
            exit 1
          fi
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of main"
            exit 1
          fi

      - name: the tag and the manifest must name the same version
        if: env.PUBLISHING == 'true'
        run: |
          tagged="${GITHUB_REF_NAME#harness-contracts-v}"
          declared="$(cd packages/contracts && npm pkg get version | tr -d '"')"
          echo "tag says $tagged, package.json says $declared"
          test "$tagged" = "$declared"

      - name: publish
        if: env.PUBLISHING == 'true'
        working-directory: packages/contracts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--provenance` and `--access public` are also in the manifest's publishConfig; passing them
        # here too means the command is correct when read on its own, and a manifest edit that
        # dropped them would not silently change what this step does.
        run: npm publish --provenance --access public

      - name: what a release would have published
        if: env.PUBLISHING != 'true'
        working-directory: packages/contracts
        run: npm pack --dry-run
